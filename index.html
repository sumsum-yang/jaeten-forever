
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f5f5">
  <title>My Favorite Person</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="phone">

    <header class="topbar">
      <span class="brand-mark">MF.</span>
      <span class="topbar-label">PERSONAL ARCHIVE</span>
      <span class="topbar-dot"></span>
    </header>

    <section class="home-screen" id="home">
      <div class="intro">
        <p class="eyebrow">A SPACE MADE FOR YOU</p>
        <h1>My favorite<br>person<span class="period">.</span></h1>
        <p class="subtitle">Little things, lasting memories.</p>
      </div>

      <div class="cover-wrap">
        <img class="cover-image"
             src="cover.jpg"
             alt="Favorite artist">
        <div class="cover-caption">
          <span>COLLECTED MOMENTS</span>
          <span>NO. 001</span>
        </div>
      </div>

      <div class="section-heading">
        <div>
          <p class="eyebrow">YOUR LITTLE UNIVERSE</p>
          <h2>Explore</h2>
        </div>
        <span class="heading-mark">↘</span>
      </div>

      
<div class="app-grid">
  <button class="app" data-app="gallery">
    <span class="app-icon">▦</span>
    <span class="app-name">Gallery</span>
    <span class="app-description">Photos & memories</span>
  </button>

  <button class="app" data-app="instagram">
    <span class="app-icon">◎</span>
    <span class="app-name">Instagram</span>
    <span class="app-description">Photos & stories</span>
  </button>

  <button class="app" data-app="line">
    <span class="app-icon">LINE</span>
    <span class="app-name">LINE</span>
    <span class="app-description">Let's talk</span>
  </button>

  <button class="app" data-app="spotify">
    <span class="app-icon">♫</span>
    <span class="app-name">Spotify</span>
    <span class="app-description">Listen together</span>
  </button>
</div>

      <footer class="home-footer">
        <span>MADE WITH LOVE</span>
        <span>✳ ALWAYS</span>
      </footer>
    </section>

    <section class="app-view hidden" id="appView">
      <button class="back-button" id="back">← Back home</button>
      <div id="appContent"></div>
    </section>

    <div class="home-indicator"></div>
  </main>

  <script src="script.js"></script>
</body>
</html>
